name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 手動実行も可能にする
  workflow_dispatch:

# GitHub Pages への書き込み権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイは 1 つに制限（前のデプロイをキャンセル）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. JSVisualizer をチェックアウト
      - name: Checkout JSVisualizer
        uses: actions/checkout@v4

      # 2. JSInterpreter を ../JSInterpreter に取得（package.json の file: 参照に合わせる）
      - name: Clone JSInterpreter
        run: |
          git clone https://github.com/tntetsu/JSInterpreter.git ../JSInterpreter

      # 3. Node.js のセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4. 依存パッケージをインストール
      - name: Install dependencies
        run: npm ci

      # 5. テストを実行
      - name: Run tests
        run: npm test

      # 6. 本番ビルド
      - name: Build
        run: npm run build

      # 7. GitHub Pages 用に成果物をアップロード
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      # 8. GitHub Pages にデプロイ
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
