<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSVisualizer</title>
  <link rel="stylesheet" href="style.css">
  <script>
    /* テーマフラッシュ防止: DOMContentLoaded より前にダークテーマを適用 */
    (function () {
      if (localStorage.getItem('jsv-theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    }());
  </script>
</head>
<body>

  <!-- ════════════════════════════════════════
       ヘッダー
  ════════════════════════════════════════ -->
  <header class="app-header">
    <div class="header-left">
      <span class="logo">🔬</span>
      <h1 class="app-title">JSVisualizer</h1>
    </div>

    <div class="header-center">
      <!-- Edit / Run（常時表示） -->
      <div class="editor-actions">
        <button id="btn-edit" class="btn btn-mode btn-mode--active"
                title="Edit mode" data-i18n="btn-edit">✏ 編集</button>
        <button id="btn-run"  class="btn btn-mode"
                title="Run"       data-i18n="btn-run">▶ 実行</button>
      </div>

      <!-- サンプル選択（Editモードのみ） -->
      <select id="sample-select" title="Select a sample">
        <option value="" data-i18n="sample-ph">— サンプル —</option>
      </select>

      <!-- ステップコントロール（Runモードのみ） -->
      <div class="step-controls-area" id="step-controls-area">
        <div class="header-sep"></div>
        <!-- ボタン列: 先頭/末尾 → 関数 → 人 → 文 → 式 -->
        <div class="ctrl-grid">
          <button id="btn-start"         class="ctrl-btn ctrl-btn--nav"
                  title="Go to start (Home)" disabled>⏮</button>
          <button id="btn-end"           class="ctrl-btn ctrl-btn--nav"
                  title="Go to end (End)" disabled>⏭</button>
          <button id="btn-call-back"     class="ctrl-btn ctrl-btn--call"
                  title="Step back func (F)" disabled>
            <span class="btn-arrows">⏪</span>
            <span class="btn-label-sm" data-i18n="label-func">関数</span>
          </button>
          <button id="btn-call-forward"  class="ctrl-btn ctrl-btn--call"
                  title="Step forward func (f)" disabled>
            <span class="btn-arrows">⏩</span>
            <span class="btn-label-sm" data-i18n="label-func">関数</span>
          </button>
          <button id="btn-human-back"    class="ctrl-btn ctrl-btn--human"
                  title="Step back human (H)" disabled>
            <span class="btn-arrows">◁</span>
            <span class="btn-label-sm" data-i18n="label-human">人</span>
          </button>
          <button id="btn-human-forward" class="ctrl-btn ctrl-btn--human"
                  title="Step forward human (h)" disabled>
            <span class="btn-arrows">▷</span>
            <span class="btn-label-sm" data-i18n="label-human">人</span>
          </button>
          <button id="btn-stmt-back"     class="ctrl-btn ctrl-btn--stmt"
                  title="Step back stmt (V)" disabled>
            <span class="btn-arrows">◀◀</span>
            <span class="btn-label-sm" data-i18n="label-stmt">文</span>
          </button>
          <button id="btn-stmt-forward"  class="ctrl-btn ctrl-btn--stmt"
                  title="Step forward stmt (v)" disabled>
            <span class="btn-arrows">▶▶</span>
            <span class="btn-label-sm" data-i18n="label-stmt">文</span>
          </button>
          <button id="btn-expr-back"     class="ctrl-btn ctrl-btn--expr"
                  title="Step back expr (← / b)" disabled>
            <span class="btn-arrows">◀</span>
            <span class="btn-label-sm" data-i18n="label-expr">式</span>
          </button>
          <button id="btn-expr-forward"  class="ctrl-btn ctrl-btn--expr"
                  title="Step forward expr (→ / n)" disabled>
            <span class="btn-arrows">▶</span>
            <span class="btn-label-sm" data-i18n="label-expr">式</span>
          </button>
        </div>
        <!-- スライダーとカウンター（ウィンドウが狭い時は2行目に折り返す） -->
        <div class="slider-area">
          <input type="range" id="step-slider" class="step-slider"
                 min="0" max="0" value="0" disabled>
          <span id="step-counter" class="step-counter"></span>
        </div>
      </div>
    </div>

    <div class="header-right">
      <button id="btn-lang" class="btn-icon btn-lang" title="Switch language / 言語切替">EN</button>
      <button id="btn-settings" class="btn-icon" title="Settings">⚙</button>
    </div>
  </header>

  <!-- 設定パネル（固定配置・初期非表示） -->
  <div id="settings-panel" class="settings-panel hidden" role="dialog" aria-label="Settings">
    <div class="settings-header" data-i18n="settings-title">設定</div>
    <div class="settings-body">
      <div class="settings-section">
        <div class="settings-section-title" data-i18n="settings-theme-title">テーマ</div>
        <label class="settings-option">
          <input type="radio" name="theme" value="light" checked>
          <span class="settings-option-icon">☀️</span>
          <span data-i18n="settings-light">ライト</span>
        </label>
        <label class="settings-option">
          <input type="radio" name="theme" value="dark">
          <span class="settings-option-icon">🌙</span>
          <span data-i18n="settings-dark">ダーク</span>
        </label>
      </div>

      <!-- ── STUDY MODE: remove this block to disable experimental features ── -->
      <hr class="settings-divider">

      <div class="settings-section">
        <div class="settings-section-title">Session Log</div>
        <div id="log-status" class="log-status">● Inactive</div>
        <button id="btn-log-start" class="log-btn">Start Session</button>

        <div id="study-marker-grid" class="study-marker-grid"></div>

        <div class="log-marker-row">
          <input type="text" id="log-marker-text" class="log-marker-input"
                 placeholder="自由マーカー（任意）">
          <button id="btn-log-marker" class="log-btn log-btn--inline">Add</button>
        </div>
        <div class="log-export-row">
          <button id="btn-log-json" class="log-btn log-btn--export" disabled>JSON</button>
          <button id="btn-log-csv"  class="log-btn log-btn--export" disabled>CSV</button>
        </div>
      </div>
      <!-- ── /STUDY MODE ── -->
    </div>
  </div>

  <!-- ════════════════════════════════════════
       メインレイアウト
  ════════════════════════════════════════ -->
  <main class="app-main">

    <!-- ── 左ペイン: ソースコード ── -->
    <section class="pane editor-pane" id="editor-pane">

      <div class="pane-header">
        <div class="pane-header-left">
          <span class="pane-title" data-i18n="source-title">ソース</span>
          <span id="program-name" class="pane-subtitle">フィボナッチ数列（再帰）</span>
        </div>
        <span class="editor-hint" data-i18n="editor-hint">コードは自由に編集して実行できます</span>
      </div>

      <!-- 編集モード（CodeMirror が mount される） -->
      <div id="editor-area" class="editor-area">
        <div id="source-editor-cm" class="cm-host"></div>
      </div>

      <!-- 実行モード: コードハイライト表示 -->
      <div id="code-display" class="code-display hidden"></div>

      <!-- エラー表示 -->
      <div id="error-msg" class="error-msg" hidden></div>

    </section>

    <!-- ── 仕切り（ドラッグでリサイズ） ── -->
    <div id="pane-divider" class="pane-divider" title="Drag to resize"></div>

    <!-- ── 右ペイン: ビュー切り替えエリア ── -->
    <section class="pane debug-pane">

      <!-- タブバー（ViewSwitcher が生成・管理） -->
      <div id="view-tabs" class="view-tabs"></div>

      <!-- ビューコンテンツ（ViewSwitcher が動的にマウント） -->
      <div id="view-container" class="view-container"></div>

      <!-- 常時表示コンソール -->
      <div id="console-panel" class="console-panel">
        <div id="console-resizer" class="console-resizer" title="Drag to resize"></div>
        <div class="console-panel-header">
          <span data-i18n="console-title">コンソール</span>
          <span id="console-count" class="console-count"></span>
        </div>
        <div id="console-output" class="console-output">
          <p class="placeholder">—</p>
        </div>
      </div>

    </section>

  </main>


  <script type="module" src="app.bundle.js"></script>
</body>
</html>
