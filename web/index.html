<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSVisualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ════════════════════════════════════════
       ヘッダー
  ════════════════════════════════════════ -->
  <header class="app-header">
    <div class="header-left">
      <span class="logo">🔬</span>
      <h1 class="app-title">JSVisualizer</h1>
    </div>
    <div class="header-right">
      <select id="sample-select" title="サンプルコードを選択">
        <option value="">— サンプル —</option>
      </select>
    </div>
  </header>

  <!-- ════════════════════════════════════════
       メインレイアウト
  ════════════════════════════════════════ -->
  <main class="app-main">

    <!-- ── 左ペイン: ソースコード ── -->
    <section class="pane editor-pane">

      <div class="pane-header">
        <span class="pane-title">Source</span>
        <div class="editor-actions">
          <button id="btn-run"   class="btn btn-primary">▶ Run</button>
          <button id="btn-reset" class="btn btn-secondary" hidden>⟳ Reset</button>
        </div>
      </div>

      <!-- 編集モード -->
      <div id="editor-area" class="editor-area">
        <textarea id="source-editor"
                  spellcheck="false"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="off"
                  placeholder="JavaScript コードを入力してください…"></textarea>
      </div>

      <!-- 実行モード: コードハイライト表示 -->
      <div id="code-display" class="code-display hidden"></div>

      <!-- エラー表示 -->
      <div id="error-msg" class="error-msg" hidden></div>

    </section>

    <!-- ── 右ペイン: ビュー切り替えエリア ── -->
    <section class="pane debug-pane">

      <!-- タブバー（ViewSwitcher が生成・管理） -->
      <div id="view-tabs" class="view-tabs"></div>

      <!-- ビューコンテンツ（ViewSwitcher が動的にマウント） -->
      <div id="view-container" class="view-container"></div>

    </section>

  </main>

  <!-- ════════════════════════════════════════
       ステップコントロールバー（フッター）
  ════════════════════════════════════════ -->
  <footer class="step-bar">

    <button id="btn-start"        class="ctrl-btn" title="先頭へ (Home)" disabled>⏮</button>

    <div class="ctrl-group">
      <button id="btn-stmt-back"  class="ctrl-btn ctrl-btn--stmt"
              title="文単位で戻る (V)" disabled>
        <span class="btn-arrows">◀◀</span>
        <span class="btn-label-sm">文</span>
      </button>
      <button id="btn-expr-back"  class="ctrl-btn ctrl-btn--expr"
              title="式単位で戻る (← / b)" disabled>
        <span class="btn-arrows">◀</span>
        <span class="btn-label-sm">式</span>
      </button>
    </div>

    <div class="ctrl-group">
      <button id="btn-expr-forward" class="ctrl-btn ctrl-btn--expr"
              title="式単位で進む (→ / n)" disabled>
        <span class="btn-arrows">▶</span>
        <span class="btn-label-sm">式</span>
      </button>
      <button id="btn-stmt-forward" class="ctrl-btn ctrl-btn--stmt"
              title="文単位で進む (v)" disabled>
        <span class="btn-arrows">▶▶</span>
        <span class="btn-label-sm">文</span>
      </button>
    </div>

    <button id="btn-end"          class="ctrl-btn" title="末尾へ (End)" disabled>⏭</button>

    <input type="range" id="step-slider" class="step-slider"
           min="0" max="0" value="0" disabled>
    <span id="step-counter" class="step-counter"></span>
  </footer>

  <script type="module" src="app.bundle.js"></script>
</body>
</html>
