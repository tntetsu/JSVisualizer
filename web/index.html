<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSVisualizer</title>
  <link rel="stylesheet" href="style.css">
  <script>
    /* テーマフラッシュ防止: DOMContentLoaded より前にダークテーマを適用 */
    (function () {
      if (localStorage.getItem('jsv-theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    }());
  </script>
</head>
<body>

  <!-- ════════════════════════════════════════
       ヘッダー
  ════════════════════════════════════════ -->
  <header class="app-header">
    <div class="header-left">
      <span class="logo">🔬</span>
      <h1 class="app-title">JSVisualizer</h1>
    </div>
    <div class="header-right">
      <select id="sample-select" title="サンプルコードを選択">
        <option value="">— サンプル —</option>
      </select>
      <button id="btn-settings" class="btn-icon" title="設定">⚙</button>
    </div>
  </header>

  <!-- 設定パネル（固定配置・初期非表示） -->
  <div id="settings-panel" class="settings-panel hidden" role="dialog" aria-label="設定">
    <div class="settings-header">設定</div>
    <div class="settings-body">
      <div class="settings-section">
        <div class="settings-section-title">テーマ</div>
        <label class="settings-option">
          <input type="radio" name="theme" value="light" checked>
          <span class="settings-option-icon">☀️</span>
          <span>ライト</span>
        </label>
        <label class="settings-option">
          <input type="radio" name="theme" value="dark">
          <span class="settings-option-icon">🌙</span>
          <span>ダーク</span>
        </label>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════
       メインレイアウト
  ════════════════════════════════════════ -->
  <main class="app-main">

    <!-- ── 左ペイン: ソースコード ── -->
    <section class="pane editor-pane" id="editor-pane">

      <div class="pane-header">
        <div class="pane-header-left">
          <span class="pane-title">Source</span>
          <span id="program-name" class="pane-subtitle">フィボナッチ数列（再帰）</span>
        </div>
        <div class="editor-actions">
          <button id="btn-run"   class="btn btn-primary">▶ Run</button>
          <button id="btn-reset" class="btn btn-secondary" hidden>⟳ Reset</button>
        </div>
      </div>

      <!-- 編集モード（CodeMirror が mount される） -->
      <div id="editor-area" class="editor-area">
        <div id="source-editor-cm" class="cm-host"></div>
      </div>

      <!-- 実行モード: コードハイライト表示 -->
      <div id="code-display" class="code-display hidden"></div>

      <!-- エラー表示 -->
      <div id="error-msg" class="error-msg" hidden></div>

    </section>

    <!-- ── 仕切り（ドラッグでリサイズ） ── -->
    <div id="pane-divider" class="pane-divider" title="ドラッグしてサイズ変更"></div>

    <!-- ── 右ペイン: ビュー切り替えエリア ── -->
    <section class="pane debug-pane">

      <!-- タブバー（ViewSwitcher が生成・管理） -->
      <div id="view-tabs" class="view-tabs"></div>

      <!-- ビューコンテンツ（ViewSwitcher が動的にマウント） -->
      <div id="view-container" class="view-container"></div>

      <!-- 常時表示コンソール -->
      <div id="console-panel" class="console-panel">
        <div id="console-resizer" class="console-resizer" title="ドラッグして高さ変更"></div>
        <div class="console-panel-header">
          Console
          <span id="console-count" class="console-count"></span>
        </div>
        <div id="console-output" class="console-output">
          <p class="placeholder">—</p>
        </div>
      </div>

    </section>

  </main>

  <!-- ════════════════════════════════════════
       ステップコントロールバー（フッター）
       レイアウト:  ⏮(高) │ 2行×4列グリッド │ ⏭(高)  ─ slider ─ counter
  ════════════════════════════════════════ -->
  <footer class="step-bar">

    <button id="btn-start" class="ctrl-btn ctrl-btn--nav"
            title="先頭へ (Home)" disabled>⏮</button>

    <!-- 2行×4列グリッド
         行1: 文(外) 式(内) 式(内) 文(外)
         行2: 関(外) 人(内) 人(内) 関(外) -->
    <div class="ctrl-grid">

      <!-- 行1: 後退◀ ─── ─── ───▶前進 -->
      <button id="btn-stmt-back"     class="ctrl-btn ctrl-btn--stmt"
              title="文単位で戻る (V)" disabled>
        <span class="btn-arrows">◀◀</span>
        <span class="btn-label-sm">文</span>
      </button>
      <button id="btn-expr-back"     class="ctrl-btn ctrl-btn--expr"
              title="式単位で戻る (← / b)" disabled>
        <span class="btn-arrows">◀</span>
        <span class="btn-label-sm">式</span>
      </button>
      <button id="btn-expr-forward"  class="ctrl-btn ctrl-btn--expr"
              title="式単位で進む (→ / n)" disabled>
        <span class="btn-arrows">▶</span>
        <span class="btn-label-sm">式</span>
      </button>
      <button id="btn-stmt-forward"  class="ctrl-btn ctrl-btn--stmt"
              title="文単位で進む (v)" disabled>
        <span class="btn-arrows">▶▶</span>
        <span class="btn-label-sm">文</span>
      </button>

      <!-- 行2: 後退◀ ─── ─── ───▶前進 -->
      <button id="btn-call-back"     class="ctrl-btn ctrl-btn--call"
              title="関数単位で戻る (F)" disabled>
        <span class="btn-arrows">⏪</span>
        <span class="btn-label-sm">関</span>
      </button>
      <button id="btn-human-back"    class="ctrl-btn ctrl-btn--human"
              title="人間単位で戻る (H)" disabled>
        <span class="btn-arrows">◁</span>
        <span class="btn-label-sm">人</span>
      </button>
      <button id="btn-human-forward" class="ctrl-btn ctrl-btn--human"
              title="人間単位で進む (h)" disabled>
        <span class="btn-arrows">▷</span>
        <span class="btn-label-sm">人</span>
      </button>
      <button id="btn-call-forward"  class="ctrl-btn ctrl-btn--call"
              title="関数単位で進む (f)" disabled>
        <span class="btn-arrows">⏩</span>
        <span class="btn-label-sm">関</span>
      </button>

    </div><!-- /ctrl-grid -->

    <button id="btn-end" class="ctrl-btn ctrl-btn--nav"
            title="末尾へ (End)" disabled>⏭</button>

    <input type="range" id="step-slider" class="step-slider"
           min="0" max="0" value="0" disabled>
    <span id="step-counter" class="step-counter"></span>
  </footer>

  <script type="module" src="app.bundle.js"></script>
</body>
</html>
